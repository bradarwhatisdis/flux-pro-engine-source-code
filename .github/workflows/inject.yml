name: Inject library.so into APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct download URL ke patched 8BP APK'
        required: true

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r24

      - name: Build library.so
        run: ndk-build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install apktool
        run: |
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool

      - name: Download patched APK
        run: wget -q -O input.apk "${{ inputs.apk_url }}"

      - name: Decompile APK
        run: apktool d -f -o decompiled input.apk

      - name: Inject library.so
        run: |
          mkdir -p decompiled/lib/arm64-v8a
          cp obj/local/arm64-v8a/library.so decompiled/lib/arm64-v8a/

      - name: Rebuild APK
        run: apktool b -o unsigned.apk decompiled

      - name: Align APK
        run: |
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | tail -1)"
          "$BUILD_TOOLS/zipalign" -p 4 unsigned.apk aligned.apk

      - name: Debug sign APK
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkey -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | tail -1)"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:android --ks-key-alias androiddebugkey --out output.apk aligned.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: 8bp-mod-patched.apk
          path: output.apk
